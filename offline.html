<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sei offline — Samurai di Avakin</title>
<meta name="theme-color" content="#03060f">
<link rel="icon" href="/assets/icons/favicon-32.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #dde6f4;
    text-align: center;
    background:
      radial-gradient(120% 90% at 78% 8%, rgba(107, 33, 168, 0.5) 0%, transparent 58%),
      radial-gradient(100% 80% at 12% 88%, rgba(46, 6, 84, 0.85) 0%, transparent 60%),
      linear-gradient(180deg, #3b0764 0%, #2e0654 55%, #0d021a 100%);
  }
  .box {
    max-width: 520px;
    padding: 46px 34px;
    border-radius: 26px;
    background: linear-gradient(150deg, rgba(216, 180, 254, 0.12), rgba(46, 6, 84, 0.48));
    border: 1px solid rgba(192, 132, 252, 0.22);
    box-shadow: 0 40px 100px -30px rgba(46, 6, 84, 1);
    backdrop-filter: blur(22px) saturate(165%);
    -webkit-backdrop-filter: blur(22px) saturate(165%);
  }
  .seal {
    width: 92px; height: 92px;
    margin: 0 auto 24px;
    display: grid;
    place-items: center;
    border-radius: 26px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-size: 2.4rem;
    background: linear-gradient(145deg, rgba(168, 85, 247, 0.3), rgba(46, 6, 84, 0.75));
    border: 1px solid rgba(192, 132, 252, 0.3);
    box-shadow: 0 0 60px -12px rgba(168, 85, 247, 0.9);
  }
  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #d8b4fe;
  }
  h1 {
    margin: 14px 0 12px;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    line-height: 1.05;
    color: #f4f8ff;
  }
  p { color: #97a6bd; font-size: 0.95rem; line-height: 1.6; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  a.btn, button.btn {
    display: inline-flex;
    align-items: center;
    padding: 13px 26px;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .btn-primary {
    color: #02060f;
    background: linear-gradient(120deg, #f4f8ff 0%, #c3e0ff 42%, #5aa8ff 100%);
    box-shadow: 0 10px 30px -12px rgba(90, 168, 255, 0.9);
  }
  .btn-ghost { color: #dde6f4; border-color: rgba(188, 201, 221, 0.2); background: rgba(143, 198, 255, 0.07); }
  a.btn:hover, button.btn:hover { transform: translateY(-2px); }
  .hint {
    margin-top: 24px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #4e5b73;
  }
</style>
</head>
<body>
  <main class="box">
    <div class="seal">侍</div>
    <p class="eyebrow">Nessuna connessione</p>
    <h1>La Gate resta aperta</h1>
    <p>
      Sei offline, ma le pagine già visitate sono ancora disponibili.
      I dati del tuo account non vengono salvati finché non torni online.
    </p>
    <div class="row">
      <button class="btn btn-primary" type="button" onclick="location.reload()">Riprova</button>
      <a class="btn btn-ghost" href="/">Torna alla home</a>
    </div>
    <p class="hint">Samurai di Avakin</p>
  </main>
  <script>
    addEventListener("online", () => location.reload());
  </script>
</body>
</html>

<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Avatar V2 — Test Isolato</title>
<style>
  body { margin:0; background:#0a0a12; color:#c8c8e0; font-family:system-ui,sans-serif; display:flex; gap:16px; padding:16px; }

  .note { font-size:11px; color:#666; margin-bottom:12px; line-height:1.4; }

<body>
  <div>
    <h1>Avatar V2 Samurai</h1>

    <div id="avatar-v2-stage"></div>
  </div>
  <div id="avatar-v2-ui"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import { avatarV2 } from './assets/js/avatar-v2/index.js';

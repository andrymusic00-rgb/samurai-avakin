services:
  - type: web
    name: samurai-avakin
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: samurai-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Samurai <onboarding@resend.dev>"
      - key: CORS_ORIGINS
        value: https://samurai-avakin.onrender.com
      - key: PUBLIC_ORIGIN
        value: https://samurai-avakin.onrender.com
      - key: COOKIE_SECURE
        value: "true"

databases:
  - name: samurai-db
    plan: free
    databaseName: samurai
    user: samurai